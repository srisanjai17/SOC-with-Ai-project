# ═══════════════════════════════════════════════════════════════════
# SOC with AI — Production Docker Compose
# ═══════════════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f soc
#   docker compose -f docker-compose.prod.yml down
# ═══════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soc_db
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${PG_PASSWORD:-soc_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - soc-network

  # ── SOC Application ──────────────────────────────────────────────
  soc:
    image: ghcr.io/${GITHUB_REPOSITORY:-user/soc-with-ai}:latest
    container_name: soc-with-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SOC_HOST=0.0.0.0
      - SOC_PORT=8000
      - SOC_WORKERS=4
      - DATABASE_URL=postgresql://soc:${PG_PASSWORD:-soc_password}@postgres:5432/soc_db
      - TZ=UTC
    volumes:
      - soc-data:/app/data
      - soc-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    networks:
      - soc-network

  # ── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: soc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/etc/nginx/certs:ro
    depends_on:
      soc:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - soc-network

# ── Volumes ────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  soc-data:
    driver: local
  soc-logs:
    driver: local
  nginx-certs:
    driver: local

# ── Networks ───────────────────────────────────────────────────────
networks:
  soc-network:
    driver: bridge
