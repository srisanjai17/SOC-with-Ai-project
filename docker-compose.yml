# ═══════════════════════════════════════════════════════════════════
# SOC with AI — Docker Compose (Production)
# Usage:
#   docker compose up -d          → Start all services
#   docker compose up -d --build  → Rebuild and start
#   docker compose logs -f soc    → Watch SOC logs
#   docker compose down           → Stop all services
# ═══════════════════════════════════════════════════════════════════

services:
  # ── SOC with AI (Main Application) ──────────────────────────────
  soc:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    container_name: soc-with-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist data across restarts
      - soc-data:/app/data
      - soc-logs:/app/logs
      # Mount config for runtime customization
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - SOC_HOST=0.0.0.0
      - SOC_PORT=8000
      - SOC_WORKERS=4
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    networks:
      - soc-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: soc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment for SSL:
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      soc:
        condition: service_healthy
    networks:
      - soc-network

  # ── Redis (Optional: for WebSocket scaling & caching) ───────────
  # Uncomment below if you need WebSocket scaling across workers
  # redis:
  #   image: redis:7-alpine
  #   container_name: soc-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - soc-network

# ═══════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════
volumes:
  soc-data:
    driver: local
  soc-logs:
    driver: local
  # redis-data:
  #   driver: local

# ═══════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════
networks:
  soc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
